<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interaktive Raumbeispiele</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { height: 100vh; width: 100%; z-index: 1; }

    /* Schwebende Steuerungsleiste */
    .top-bar {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      background: white;
      padding: 8px 12px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      display: flex;
      gap: 8px;
    }

    button {
      background: #0066cc;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover { background: #0052a3; }
    button.secondary { background: #666; }

    /* Lehrkraft-Eingabepanel */
    #admin-panel {
      display: none;
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: white;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      width: 90%;
      max-width: 480px;
    }
    #admin-panel h3 { margin: 0 0 10px 0; font-size: 1.1rem; }
    #admin-panel input, #admin-panel textarea, #admin-panel select {
      width: 100%;
      margin-bottom: 8px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    .hint { font-size: 0.8rem; color: #555; margin-bottom: 8px; }
  </style>
</head>
<body>

  <!-- Obere Steuerungsleiste -->
  <div class="top-bar">
    <button id="auth-btn" onclick="toggleAdminMode()">🔒 Lehrkraft-Modus</button>
  </div>

  <!-- Eingabemaske für neue Raumbeispiele -->
  <div id="admin-panel">
    <h3>Neues Raumbeispiel eintragen</h3>
    <div class="hint">Tipp: Klicke auf die Karte, um die Koordinaten automatisch zu setzen.</div>
    <input type="text" id="entry-title" placeholder="Titel (z. B. Eyjafjallajökull)" required />
    <input type="text" id="entry-topic" placeholder="Thema / Einheit (z. B. Vulkanismus)" />
    <textarea id="entry-desc" rows="3" placeholder="Fachlicher Inhalt / Beschreibung..."></textarea>
    
    <div style="display: flex; gap: 8px;">
      <input type="text" id="entry-lat" placeholder="Breitengrad" readonly />
      <input type="text" id="entry-lng" placeholder="Längengrad" readonly />
    </div>

    <div style="display: flex; justify-content: space-between; margin-top: 8px;">
      <button onclick="saveMarkerLocally()">Marker hinzufügen</button>
      <button class="secondary" onclick="exportData()">JSON exportieren</button>
      <button class="secondary" onclick="toggleAdminMode()">Schließen</button>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // 1. Initialer Datenbestand (hier können Sie exportierte Daten dauerhaft einfügen)
    const defaultData = [
      {
        title: "Eyjafjallajökull (Island)",
        topic: "Endogene Dynamik",
        desc: "Schichtvulkan unter einem Gletscher; Ausbruch 2010 führte zu monatelangen Störungen des europäischen Flugverkehrs.",
        lat: 63.63,
        lng: -19.62
      },
      {
        title: "Ätna (Sizilien)",
        topic: "Endogene Dynamik",
        desc: "Europas aktivster Vulkan; Leben und Wirtschaften an fruchtbaren Hängen trotz permanenter Gefährdung.",
        lat: 37.75,
        lng: 15.00
      }
    ];

    // Vorhandene Daten aus dem Browser-Speicher laden (oder Fallback auf Standard)
    let savedData = JSON.parse(localStorage.getItem('custom_markers')) || [];
    let allMarkers = [...defaultData, ...savedData];

    // 2. Karte initialisieren
    const map = L.map('map').setView([25, 10], 3);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap',
      maxZoom: 18
    }).addTo(map);

    const markerGroup = L.layerGroup().addTo(map);

    // Marker auf der Karte rendern
    function renderMarkers() {
      markerGroup.clearLayers();
      allMarkers.forEach(item => {
        L.marker([item.lat, item.lng])
          .bindPopup(`<b>${item.title}</b><br><small><i>${item.topic}</i></small><p>${item.desc}</p>`)
          .addTo(markerGroup);
      });
    }
    renderMarkers();

    // 3. Lehrkraft-Modus Logik
    let isAdmin = false;
    let tempMarker = null;
    const ADMIN_PW = "erdkunde2026"; // Ändern Sie hier Ihr Kennwort!

    function toggleAdminMode() {
      if (!isAdmin) {
        const input = prompt("Passwort für Lehrkraft-Bereich eingeben:");
        if (input === ADMIN_PW) {
          isAdmin = true;
          document.getElementById('admin-panel').style.display = 'block';
          document.getElementById('auth-btn').innerText = "🔓 Abmelden";
        } else if (input !== null) {
          alert("Falsches Passwort!");
        }
      } else {
        isAdmin = false;
        document.getElementById('admin-panel').style.display = 'none';
        document.getElementById('auth-btn').innerText = "🔒 Lehrkraft-Modus";
        if (tempMarker) map.removeLayer(tempMarker);
      }
    }

    // Bei Klick auf die Karte Koordinaten in die Maske übernehmen
    map.on('click', function(e) {
      if (!isAdmin) return;
      
      const { lat, lng } = e.latlng;
      document.getElementById('entry-lat').value = lat.toFixed(4);
      document.getElementById('entry-lng').value = lng.toFixed(4);

      if (tempMarker) map.removeLayer(tempMarker);
      tempMarker = L.marker([lat, lng], { opacity: 0.7 }).addTo(map);
    });

    // Neuen Marker speichern (im Browser)
    function saveMarkerLocally() {
      const title = document.getElementById('entry-title').value;
      const topic = document.getElementById('entry-topic').value;
      const desc = document.getElementById('entry-desc').value;
      const lat = parseFloat(document.getElementById('entry-lat').value);
      const lng = parseFloat(document.getElementById('entry-lng').value);

      if (!title || isNaN(lat) || isNaN(lng)) {
        alert("Bitte mindestens einen Titel angeben und auf die Karte klicken!");
        return;
      }

      const newEntry = { title, topic, desc, lat, lng };
      savedData.push(newEntry);
      localStorage.setItem('custom_markers', JSON.stringify(savedData));
      
      allMarkers.push(newEntry);
      renderMarkers();

      // Formular zurücksetzen
      document.getElementById('entry-title').value = '';
      document.getElementById('entry-topic').value = '';
      document.getElementById('entry-desc').value = '';
      document.getElementById('entry-lat').value = '';
      document.getElementById('entry-lng').value = '';
      if (tempMarker) map.removeLayer(tempMarker);

      alert("Marker hinzugefügt! Klicke auf 'JSON exportieren', wenn du die Daten fest auf GitHub sichern willst.");
    }

    // Daten als JSON ausgeben, um sie dauerhaft in defaultData zu kopieren
    function exportData() {
      const jsonStr = JSON.stringify(allMarkers, null, 2);
      navigator.clipboard.writeText(jsonStr).then(() => {
        alert("Der gesamte Datenbestand wurde in deine Zwischenablage kopiert! Du kannst ihn in GitHub im 'defaultData'-Array ersetzen.");
      });
    }
  </script>
</body>
</html>
